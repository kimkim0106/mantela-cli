; 利用者が書く extensions.conf（mantela-cli は書き換えない）

[general]
static = yes
writeprotect = yes

; mantela-cli の生成物（/etc/asterisk/mantela-cli/）を読み込む
#include mantela-cli/extensions.conf

; kind = "dialplan" の内線が Goto する先（アプリ本体は利用者が持つ）
[echo-test]
exten => s,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

[jihou]
exten => s,1,Answer()
 same => n,SayUnixTime(,Asia/Tokyo,HMS)
 same => n,Hangup()
