# sample では当たらない段階0の分岐を確かめる局ディレクトリ
[mantela-cli]
version = 1

[mantela]
version = "0.1.3"

# 書いた順ではなく Mantela のスキーマの順に出し、スキーマに無い項目は書いた順で後ろに足す
[mantela.aboutMe]
x-zeta = "スキーマに無い項目"
sipUri = ["sip:pbx.example.net:5060;transport=udp"]
identifier = "123e4567-e89b-12d3-a456-426614174000"
geolocationCoordinates = { longitude = 139.76, latitude = 35.68 }
preferredPrefix = "200"
name = "<Variations> & Station"
x-alpha = 1

[asterisk]
secrets = "/etc/asterisk/other_secrets.conf"
hop = false               # 段階0では読むだけ
